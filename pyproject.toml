[tool.ruff]
target-version = "py311"
line-length = 110
src = ["backend", "worker", "scripts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"worker/main.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
files = ["backend/app", "worker", "scripts/generate_orders_csv.py"]
exclude = ["backend/\\.venv", "backend/migrations", "backend/tests"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q -m 'not nats'"
markers = ["nats: requires a JetStream server"]
