repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/python -m ruff check backend worker scripts
        language: system
        pass_filenames: false
        stages: [pre-commit]
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest
        entry: bash
        args: ["-c", "cd backend && ../.venv/bin/python -m pytest -m 'not nats'"]
        language: system
        pass_filenames: false
        stages: [pre-push]
