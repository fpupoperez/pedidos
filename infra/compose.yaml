services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://orders:orders@postgres:5432/orders
      DATABASE_READ_URL: postgresql+psycopg://orders_reader:orders_reader@postgres:5432/orders
      NATS_URL: nats://nats:4222
      NATS_DELIVERY: jetstream
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://orders:orders@postgres:5432/orders
      DATABASE_READ_URL: postgresql+psycopg://orders_reader:orders_reader@postgres:5432/orders
      NATS_URL: nats://nats:4222
      NATS_DELIVERY: jetstream
      DATA_DIR: /app/data
      OTEL_SERVICE_NAME: orders-worker
    volumes:
      - uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started

volumes:
  uploads:
